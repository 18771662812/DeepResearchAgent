[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Deep research agent with a hand-written tool-use loop, SSE streaming and DeepSeek."
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "ddgs>=9.16.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "openai>=3.31.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 提示词是给模型看的文本，不按代码行宽强制换行
"app/agent/prompts.py" = ["E501"]
"eval/prompts.py" = ["E501"]
